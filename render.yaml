services:
  - type: web
    name: worqestra
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: worqestra-db
          property: connectionString

databases:
  - name: worqestra-db
    plan: free
    databaseName: worqestra
    user: worqestra
